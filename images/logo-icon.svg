<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Base de suelo / línea de nivel -->
  <rect x="2" y="90" width="96" height="4" rx="2" fill="#B85836"/>

  <!-- Muro / Paño arquitectónico en aplicación -->
  <path d="M52 14 L88 6 L88 90 L52 90 Z" fill="#B85836" fill-opacity="0.2" stroke="#B85836" stroke-width="3" stroke-linejoin="round"/>
  <line x1="64" y1="11" x2="64" y2="90" stroke="#B85836" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="76" y1="9" x2="76" y2="90" stroke="#B85836" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Llana / Espátula de estucador -->
  <polygon points="68,26 88,32 80,62 60,56" fill="#FFFFFF" stroke="#C88A42" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="66" y1="41" x2="78" y2="44" stroke="#B85836" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Brazo en movimiento de aplicación -->
  <path d="M36 53 L58 48 L72 45" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="72" cy="45" r="4.5" fill="#FFFFFF"/>

  <!-- Cabeza y gorra del trabajador -->
  <circle cx="36" cy="24" r="9" fill="#FFFFFF"/>
  <path d="M30 19 C35 16 43 16 50 20 L50 24 L38 24 Z" fill="#C88A42"/>

  <!-- Torso y overol -->
  <path d="M26 35 C30 31 38 31 46 35 L42 62 L24 62 Z" fill="#FFFFFF"/>

  <!-- Brazo izquierdo -->
  <path d="M24 39 L16 53 L13 65" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Piernas en postura firme -->
  <path d="M36 61 L49 71 L49 90" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M27 61 L18 76 L18 90" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Calzado -->
  <rect x="12" y="86" width="14" height="4.5" rx="1.5" fill="#C88A42"/>
  <rect x="45" y="86" width="16" height="4.5" rx="1.5" fill="#C88A42"/>
</svg>
